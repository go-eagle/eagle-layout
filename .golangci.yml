# golangci-lint v2 configuration.
# Generated code is excluded below; do not disable a linter globally to hide it.
version: "2"

run:
  go: "1.22"
  timeout: 10m
  tests: true
  issues-exit-code: 1

linters:
  default: none
  enable:
    - bodyclose
    - depguard
    - dogsled
    - errcheck
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - lll
    - misspell
    - revive
    - rowserrcheck
    - staticcheck
    - unconvert
    - unused
    - whitespace
  settings:
    depguard:
      rules:
        main:
          files:
            - $all
          deny:
            - pkg: github.com/sirupsen/logrus
              desc: use github.com/go-eagle/eagle/pkg/log
    dogsled:
      max-blank-identifiers: 2
    errcheck:
      check-type-assertions: false
      check-blank: false
    goconst:
      min-len: 3
      min-occurrences: 3
    gocyclo:
      min-complexity: 20
    govet:
      disable:
        - shadow
    lll:
      line-length: 200
      tab-width: 1
    misspell:
      locale: US
    revive:
      # Listing rules replaces revive's defaults, so the default set is repeated
      # here. package-comments is omitted: this template has many tiny packages
      # (Wire sets, cache, ecode) and the rule does not catch defects.
      # unused-parameter is omitted because interface methods and constructors
      # keep parameters they must accept even when a body does not read them.
      # var-naming is omitted because Id and UserId match protobuf fields.
      # Renaming them breaks jinzhu/copier into pb.User and the JSON shape of
      # untagged fields.
      confidence: 0.8
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: if-return
        - name: increment-decrement
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id
    whitespace:
      multi-if: false
      multi-func: false
  exclusions:
    generated: strict
    warn-unused: false
    rules:
      # Tests construct invalid input and ignore cleanup errors on purpose.
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - gocyclo
          - goconst
      # go:generate lines are commands, not prose, and are often longer than the limit.
      - linters:
          - lll
        source: "^//go:generate "
    # Headers already match the Go generated-file convention (strict above).
    # These paths document the generators we commit and keep a file excluded
    # when a header is missing or non-standard.
    paths:
      - '\.pb\.go$'
      - '\.pb\.validate\.go$'
      - 'wire_gen\.go$'
      - '\.gen\.go$'
      - 'internal/mocks/'
      - third_party/

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes:
        - github.com/go-eagle/eagle-layout
  exclusions:
    generated: strict
    paths:
      - '\.pb\.go$'
      - '\.pb\.validate\.go$'
      - 'wire_gen\.go$'
      - '\.gen\.go$'
      - 'internal/mocks/'
      - third_party/

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
