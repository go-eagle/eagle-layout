name: Run unit tests
# This workflow will run on master branch and on any pull requests targeting master

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: "1.22"

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup golangci-lint
        run: make lint
        env:
          # Keep this pin identical to GOLANGCI_LINT_VERSION in the Makefile.
          GOLANGCI_LINT_VERSION: v2.15.0

  test:
    needs: lint
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        go: ["1.22"]
    name: Test ${{ matrix.os }} @ Go ${{ matrix.go }}
    runs-on: ${{ matrix.os }}
    env:
      GO111MODULE: on
      GOPROXY: https://proxy.golang.org
    steps:
      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v4
        with:
          go-version: ${{ matrix.go }}

      - name: Check out code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.ref }}

      - name: Run Unit tests
        run: make test

      - name: Check service coverage
        run: make cover-check
        env:
          SERVICE_COVERAGE_MIN: "70"

      - name: Upload Coverage to CodeCov
        uses: codecov/codecov-action@v3
        with:
          flags: ${{ matrix.os }},go-${{ matrix.go }}
          token: ${{secrets.CODECOV_TOKEN}}
          file: ./coverage.txt
